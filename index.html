<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- config.json 提前发车。-->
    <script>
      window.__configPromise = fetch('%BASE_URL%config.json', { cache: 'no-cache' })
      window.__configPromise.catch(function () {})
    </script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.font.im" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.font.im" crossorigin />
    <!-- 字体异步加载：media="print"  -->
    <link
      href="https://fonts.font.im/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.font.im/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading…</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
