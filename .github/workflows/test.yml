# ============================================================
# Workflow: Test 分支 — 自动化测试
#
# 触发条件：
#   - 向 test 分支提交 PR 时触发（用于预览测试结果）
#   - 代码推送到 test 分支时触发（PR 合并后执行完整测试）
#
# 流程：
#   1. 代码检查（type-check + lint + unit test）
#   2. 构建（test 环境变量）
#   3. e2e 测试（Playwright，CI 模式）
#   （合并到 dev 由开发者手动操作 PR）
# ============================================================

name: Test

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

jobs:
  # ---- Job 1: 静态检查 + 单元测试 ----
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # type-check + lint + unit test（与 package.json 中 check 脚本一致）
      - run: npm run check

      - run: npm run docs:type-check

      # 文档站构建：验证死链、frontmatter 与静态页面生成
      # 与部署阶段 docker build 内的 `RUN npm run docs:build` 行为一致，提前到 PR 阶段拦截
      - run: npm run docs:build

  # 固定 HTTP 响应的浏览器回归独立运行，不依赖账号和 LLM secrets。
  e2e-offline:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
        env:
          VITE_API_BASE: /api
      - run: npm run test:e2e:offline
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-offline-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---- 真实后端 E2E（依赖 check 通过）----
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 安装 Playwright 浏览器（chromium / firefox / webkit 全装，与 config 中 3 个 project 对齐）
      - run: npx playwright install --with-deps

      # 构建（test 环境变量，需存在 env/.env.production 或 CI 注入）
      - run: npm run build
        env:
          VITE_API_BASE: /api

      # 真实后端组（CI 模式：headless + retry + 单 worker）；离线组由独立 job 执行
      # 登录账号密码从 GitHub Secrets 注入，避免硬编码（见 e2e/auth.setup.ts）
      - run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit --project=chromium-zh
        env:
          CI: 'true'
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # 保留测试报告以便排查
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

