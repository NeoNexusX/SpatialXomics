# ============================================================
# Workflow: Main 分支 — 自动构建 Docker 镜像 → 部署到 生产（main）服务器
#
# 触发条件：代码推送到 main 分支
#
# 流程：
#   1. 构建检查（type-check + lint + unit test）
#   2. 生产构建（vite build）
#   3. Docker 镜像构建 + 推送（仅打 latest tag）
#   4. SSH 到 main 服务器 → 直接从 docker.io 拉取最新镜像 → 重启容器
#      → 健康检查通过后，清理悬空（<none>）镜像
#
# 正式环境配置替换：构建镜像前自动执行 scripts/apply-prod-config.mjs，把
# env/config.prod.overrides.json 深合并进 public/config.json。正式服务器与
# 测试服务器有差异的配置（目前是 OSS 预览图域名，正式服指向 CDN）只写进
# 覆盖文件即可，其余配置两边共用仓库主文件，无需维护两份完整 config。
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions → Secrets 标签页）：
#   MAIN_SERVER_HOST     — 生产服务器 IP
#   MAIN_SERVER_USER     — SSH 用户名
#   MAIN_SERVER_SSH_KEY  — SSH 私钥（用于免密登录）
#   DOCKER_USERNAME      — DockerHub 用户名（与 dev 复用同一账号）
#   DOCKER_PASSWORD      — DockerHub Access Token（与 dev 复用同一 Token）
#   IMAGE_REPO           — DockerHub 仓库名（与 dev 复用同一仓库）
#                          → 最终镜像名为 docker.io/$DOCKER_USERNAME/$IMAGE_REPO
#
# 端口配置：
#   FRONTEND_PORT        — 前端容器对外暴露的端口（env.FRONTEND_PORT，默认 8080），
#                          容器内 nginx 始终监听 80，外部端口由 -p 映射决定
# ============================================================

name: Build & Deploy to Main

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_REPO }}
  # main 服务器可直连 Docker Hub，无需 1ms 镜像代理，每次部署直接拉取 latest
  IMAGE_TAG: latest
  # 前端容器对外暴露的端口（可在此按需修改，默认 8080）
  FRONTEND_PORT: '8080'
  # 后端服务地址与端口（传递给 nginx 反向代理）
  BACKEND_HOST: 'host.docker.internal'
  BACKEND_PORT: '8000'

jobs:
  # ---- Job 1: 构建 + 推送 Docker 镜像 ----
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 快速检查（不阻塞，仅确保基本质量）
      - run: npm ci
      - run: npm run check

      # 登录 Docker Registry
      - name: Login to Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin docker.io

      # 正式环境配置替换（只影响本次构建的镜像，不回写仓库）
      - name: Apply prod config overrides
        run: node scripts/apply-prod-config.mjs

      # 构建 Docker 镜像（内置 npm ci + vite build）
      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

      # 推送到镜像仓库
      - name: Push Docker image
        run: docker push $IMAGE_NAME:$IMAGE_TAG

  # ---- Job 2: 部署到 main 服务器 ----
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAIN_SERVER_HOST }}
          username: ${{ secrets.MAIN_SERVER_USER }}
          key: ${{ secrets.MAIN_SERVER_SSH_KEY }}
          # env: 块里的变量只存在于 runner，必须用 envs 显式透传到远程脚本
          envs: IMAGE_NAME,IMAGE_TAG,FRONTEND_PORT,BACKEND_HOST,BACKEND_PORT
          script: |
            # 任一命令失败立即终止，避免拉取失败后仍执行后续删除/清理
            set -e

            # 直接从 docker.io 拉取最新镜像，失败重试 3 次
            PULLED=0
            for i in 1 2 3; do
              if docker pull $IMAGE_NAME:$IMAGE_TAG; then
                PULLED=1
                break
              fi
              echo "Pull failed (attempt $i/3), retrying in 15s..."
              sleep 15
            done
            if [ "$PULLED" != "1" ]; then
              echo "Image pull failed after 3 attempts, aborting (old container untouched)"
              exit 1
            fi

            # 停止并删除旧容器（如果存在）
            docker stop massvision-frontend 2>/dev/null || true
            docker rm massvision-frontend 2>/dev/null || true

            # 启动新容器
            # -e 传入后端地址/端口 → entrypoint.sh 在启动时写入 nginx 配置
            # --add-host 让 host.docker.internal 解析到宿主机（无需 --network host）
            # -p 将宿主机 ${FRONTEND_PORT} 映射到容器内 nginx 的 80 端口
            docker run -d \
              --name massvision-frontend \
              --restart unless-stopped \
              --add-host host.docker.internal:host-gateway \
              -p ${FRONTEND_PORT}:80 \
              -e BACKEND_HOST=${BACKEND_HOST} \
              -e BACKEND_PORT=${BACKEND_PORT} \
              $IMAGE_NAME:$IMAGE_TAG

            # 健康检查：容器保持 running 且 nginx 能响应才算部署成功
            HEALTHY=0
            for i in $(seq 1 10); do
              sleep 3
              if [ "$(docker inspect -f '{{.State.Running}}' massvision-frontend 2>/dev/null)" = "true" ] \
                && curl -fsS -o /dev/null http://127.0.0.1:${FRONTEND_PORT}/; then
                HEALTHY=1
                echo "Health check passed"
                break
              fi
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "Health check failed, container logs:"
              docker logs --tail 100 massvision-frontend || true
              exit 1
            fi

            # 部署成功后清理悬空镜像（被新 latest 替换下来的旧镜像层）
            docker image prune -f
